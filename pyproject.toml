[project]
name = "electricity-forcasting"
version = "0.1.0"
description = "QRT ENS electricity price challenge materials and benchmark"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.1.0",
    "jax>=0.11.1",
    "matplotlib>=3.10.0",
    "numpy>=2.4.0",
    "optax>=0.2.8",
    "pandas>=3.0.0",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
]
